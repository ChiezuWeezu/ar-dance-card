<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Points to target.mind (without 's') and turns off the stuck loading spinner -->
    <a-scene 
      mindar-image="imageTargetSrc: ./target.mind; uiLoading: no; uiScanning: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="dancingCharacter" src="./character.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Bright Red Box Test to confirm tracking triggers -->
        <a-box position="0 0.4 0" scale="0.3 0.3 0.3" material="color: red;"></a-box>

        <!-- Your 3D Character -->
        <a-gltf-model 
         position="X Y Z" 
         rotation="X Y Z" 
         scale="X Y Z" 
         src="#dancingCharacter">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
